<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>Rucoy Online Kingdom</title>
<style>
  :root{
    --bg:#262626;
    --panel:#2f2f2f;
    --panel-2:#383838;
    --line:#454545;
    --ink:#f0eee9;
    --muted:#a8a49c;
    --accent:#c9a24b;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
  body{
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:"Press Start 2P",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.7;
  }

  /* --- pixel icon box: se ve bien igual si el png es 16x16 o 160x160 --- */
  .icon-box{
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .icon-box img{
    width:100%;
    height:100%;
    object-fit:contain;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1rem 1.25rem;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:env(safe-area-inset-top,0px);
    background:var(--bg);
    z-index:10;
  }
  header .title{font-size:.7rem;letter-spacing:.02em}

  .monster-btn{
    display:flex;
    align-items:center;
    gap:.6rem;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    padding:.6rem .9rem .6rem .5rem;
    border-radius:10px;
    cursor:pointer;
    font-size:.6rem;
  }
  .monster-btn:hover{border-color:var(--accent)}
  .monster-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .monster-btn .icon-box{width:34px;height:34px;flex:none;border-radius:6px}

  main{max-width:960px;margin:0 auto;padding:1.5rem 1.25rem 3rem}

  #categoria-monstruos{display:none}
  #categoria-monstruos.abierta{display:block}

  .cat-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:1rem;
  }
  .cat-header h2{font-size:.75rem;font-weight:400;color:var(--muted);text-transform:none}

  .monster-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:1rem;
  }
  .monster-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:.85rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.55rem;
    cursor:pointer;
    text-align:center;
  }
  .monster-card:hover, .monster-card:focus-visible{border-color:var(--accent);outline:none}
  .monster-card .icon-box{width:72px;height:72px}
  .monster-card .m-nombre{font-size:.62rem}
  .monster-card .m-nivel{font-size:.55rem;color:var(--muted)}

  /* --- modal --- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:1.25rem;
    z-index:100;
  }
  .overlay.abierta{display:flex}

  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    max-width:420px;
    width:100%;
    max-height:calc(100% - 2rem);
    overflow-y:auto;
    padding:1.25rem;
  }
  .modal-top{
    display:flex;
    gap:1rem;
    align-items:center;
  }
  .modal-top .icon-box{width:88px;height:88px;flex:none}
  .modal-info h3{font-size:.75rem;line-height:1.5}
  .modal-info .m-nivel{color:var(--muted);font-size:.6rem;margin-top:.5rem}

  .modal-cerrar{
    margin-left:auto;
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    width:32px;height:32px;
    border-radius:8px;
    cursor:pointer;
    font-size:1rem;
    line-height:1;
  }
  .modal-cerrar:hover{color:var(--ink);border-color:var(--accent)}

  .drops h4{
    margin-top:1.5rem;
    margin-bottom:.7rem;
    font-size:.62rem;
    color:var(--muted);
    font-weight:400;
  }
  .drop-list{display:flex;flex-direction:column;gap:.5rem}
  .drop-item{
    display:flex;
    align-items:center;
    gap:.7rem;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:.45rem .6rem;
  }
  .drop-item .icon-box{width:36px;height:36px;flex:none;border-radius:6px}
  .drop-item span{font-size:.6rem;line-height:1.5}

  @media (max-width:480px){
    .monster-grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
    .monster-card .icon-box{width:60px;height:60px}
  }
</style>
</head>
<body>

<header>
  <span class="title">Rucoy Online Kingdom</span>
  <button class="monster-btn" id="btn-monstruos" aria-expanded="false" aria-controls="categoria-monstruos">
    <span class="icon-box"><img src="monsterbutton.png" alt=""></span>
    Monstruos
  </button>
</header>

<main>
  <section id="categoria-monstruos" aria-label="Categoría de monstruos">
    <div class="cat-header">
      <h2>Monstruos</h2>
    </div>
    <div class="monster-grid" id="monster-grid"></div>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-nombre">
    <div class="modal-top">
      <span class="icon-box"><img id="modal-img" src="" alt=""></span>
      <div class="modal-info">
        <h3 id="modal-nombre"></h3>
        <div class="m-nivel" id="modal-nivel"></div>
      </div>
      <button class="modal-cerrar" id="btn-cerrar" aria-label="Cerrar">✕</button>
    </div>
    <div class="drops">
      <h4>Objetos que dropea</h4>
      <div class="drop-list" id="modal-drops"></div>
    </div>
  </div>
</div>

<script>
  // --- Datos de ejemplo: sustituye o amplía esta lista cuando tengas tus propios monstruos ---
  const monstruos = [
    {
      nombre: "Slime",
      nivel: 1,
      icono: "monstruoname.png",
      drops: [
        { nombre: "Gel viscoso", icono: "itemdefault.png" },
        { nombre: "Fragmento gelatinoso", icono: "itemdefault.png" },
        { nombre: "Núcleo de slime", icono: "itemdefault.png" }
      ]
    },
    {
      nombre: "Goblin",
      nivel: 3,
      icono: "monstruoname.png",
      drops: [
        { nombre: "Daga oxidada", icono: "itemdefault.png" },
        { nombre: "Oreja de goblin", icono: "itemdefault.png" },
        { nombre: "Moneda de cobre", icono: "itemdefault.png" }
      ]
    },
    {
      nombre: "Esqueleto",
      nivel: 5,
      icono: "monstruoname.png",
      drops: [
        { nombre: "Hueso", icono: "itemdefault.png" },
        { nombre: "Espada rota", icono: "itemdefault.png" },
        { nombre: "Cráneo", icono: "itemdefault.png" }
      ]
    },
    {
      nombre: "Araña gigante",
      nivel: 7,
      icono: "monstruoname.png",
      drops: [
        { nombre: "Seda de araña", icono: "itemdefault.png" },
        { nombre: "Colmillo venenoso", icono: "itemdefault.png" },
        { nombre: "Ojo compuesto", icono: "itemdefault.png" }
      ]
    },
    {
      nombre: "Dragón joven",
      nivel: 15,
      icono: "monstruoname.png",
      drops: [
        { nombre: "Escama de dragón", icono: "itemdefault.png" },
        { nombre: "Garra afilada", icono: "itemdefault.png" },
        { nombre: "Aliento embotellado", icono: "itemdefault.png" }
      ]
    }
  ];

  const grid = document.getElementById("monster-grid");
  const btnMonstruos = document.getElementById("btn-monstruos");
  const categoria = document.getElementById("categoria-monstruos");
  const overlay = document.getElementById("overlay");
  const btnCerrar = document.getElementById("btn-cerrar");

  function renderGrid(){
    grid.innerHTML = "";
    monstruos.forEach((m, i) => {
      const card = document.createElement("button");
      card.className = "monster-card";
      card.innerHTML = `
        <span class="icon-box"><img src="${m.icono}" alt=""></span>
        <span class="m-nombre">${m.nombre}</span>
        <span class="m-nivel">Nivel ${m.nivel}</span>
      `;
      card.addEventListener("click", () => abrirModal(i));
      grid.appendChild(card);
    });
  }

  function abrirModal(i){
    const m = monstruos[i];
    document.getElementById("modal-img").src = m.icono;
    document.getElementById("modal-nombre").textContent = m.nombre;
    document.getElementById("modal-nivel").textContent = "Nivel " + m.nivel;

    const dropsBox = document.getElementById("modal-drops");
    dropsBox.innerHTML = "";
    m.drops.forEach(d => {
      const row = document.createElement("div");
      row.className = "drop-item";
      row.innerHTML = `
        <span class="icon-box"><img src="${d.icono}" alt=""></span>
        <span>${d.nombre}</span>
      `;
      dropsBox.appendChild(row);
    });

    overlay.classList.add("abierta");
  }

  function cerrarModal(){
    overlay.classList.remove("abierta");
  }

  btnMonstruos.addEventListener("click", () => {
    const abierta = categoria.classList.toggle("abierta");
    btnMonstruos.setAttribute("aria-expanded", abierta);
  });

  btnCerrar.addEventListener("click", cerrarModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) cerrarModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarModal(); });

  renderGrid();
</script>

</body>
</html>

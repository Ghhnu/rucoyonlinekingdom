<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>Rucoy Online Kingdom</title>
<style>
  :root{
    --bg:#262626;
    --panel:#2f2f2f;
    --panel-2:#383838;
    --line:#454545;
    --ink:#f0eee9;
    --muted:#a8a49c;
    --accent:#c9a24b;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
  body{
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:"Press Start 2P",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.7;
  }

  /* --- pixel icon box: looks right whether the png is 16x16 or 160x160 --- */
  .icon-box{
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .icon-box img{
    width:100%;
    height:100%;
    object-fit:contain;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1rem 1.25rem;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:env(safe-area-inset-top,0px);
    background:var(--bg);
    z-index:10;
  }
  header .title{font-size:.7rem;letter-spacing:.02em}

  .monster-btn{
    display:flex;
    align-items:center;
    gap:.6rem;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    padding:.6rem .9rem .6rem .5rem;
    border-radius:10px;
    cursor:pointer;
    font-size:.6rem;
  }
  .monster-btn:hover{border-color:var(--accent)}
  .monster-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .monster-btn .icon-box{width:34px;height:34px;flex:none;border-radius:6px}

  main{max-width:960px;margin:0 auto;padding:1.5rem 1.25rem 3rem}

  /* --- hint shown before anything is opened, cycling through the header options --- */
  #hint{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.5rem;
    text-align:center;
    padding:4rem 1rem 3.5rem;
  }
  #hint p{
    font-size:.7rem;
    color:var(--muted);
    line-height:1.8;
    max-width:26ch;
  }
  #hint-carousel{
    position:relative;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hint-chip{
    position:absolute;
    display:flex;
    align-items:center;
    gap:.6rem;
    background:var(--panel);
    border:1px solid var(--line);
    padding:.6rem .9rem .6rem .5rem;
    border-radius:10px;
    font-size:.6rem;
    opacity:0;
    transition:opacity .35s ease;
    pointer-events:none;
  }
  .hint-chip.visible{opacity:1}
  .hint-chip .icon-box{width:34px;height:34px;flex:none;border-radius:6px}

  #monster-category{display:none}
  #monster-category.open{display:block}

  .cat-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:1rem;
  }
  .cat-header h2{font-size:.75rem;font-weight:400;color:var(--muted);text-transform:none}

  .monster-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:1rem;
  }
  .monster-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:.85rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.55rem;
    cursor:pointer;
    text-align:center;
  }
  .monster-card:hover, .monster-card:focus-visible{border-color:var(--accent);outline:none}
  .monster-card .icon-box{width:72px;height:72px}
  .monster-card .m-name{font-size:.62rem}
  .monster-card .m-level{font-size:.55rem;color:var(--muted)}

  /* --- modal --- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:1.25rem;
    z-index:100;
  }
  .overlay.open{display:flex}

  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    max-width:420px;
    width:100%;
    max-height:calc(100% - 2rem);
    overflow-y:auto;
    padding:1.25rem;
  }
  .modal-top{
    display:flex;
    gap:1rem;
    align-items:center;
  }
  .modal-top .icon-box{width:88px;height:88px;flex:none}
  .modal-info h3{font-size:.75rem;line-height:1.5}
  .modal-info .m-level{color:var(--muted);font-size:.6rem;margin-top:.5rem}

  .modal-close{
    margin-left:auto;
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    width:32px;height:32px;
    border-radius:8px;
    cursor:pointer;
    font-size:1rem;
    line-height:1;
  }
  .modal-close:hover{color:var(--ink);border-color:var(--accent)}

  .drops h4{
    margin-top:1.5rem;
    margin-bottom:.7rem;
    font-size:.62rem;
    color:var(--muted);
    font-weight:400;
  }
  .drop-list{display:flex;flex-direction:column;gap:.5rem}
  .drop-item{
    display:flex;
    align-items:center;
    gap:.7rem;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:.45rem .6rem;
  }
  .drop-item .icon-box{width:36px;height:36px;flex:none;border-radius:6px}
  .drop-item span{font-size:.6rem;line-height:1.5}

  @media (max-width:480px){
    .monster-grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
    .monster-card .icon-box{width:60px;height:60px}
  }
</style>
</head>
<body>

<header>
  <span class="title">Rucoy Online Kingdom</span>
  <button class="monster-btn" id="btn-monsters" aria-expanded="false" aria-controls="monster-category">
    <span class="icon-box"><img src="monsterbutton.png" alt=""></span>
    Monsters
  </button>
</header>

<main>
  <div id="hint">
    <p>Select one of the options above</p>
    <div id="hint-carousel"></div>
  </div>

  <section id="monster-category" aria-label="Monsters category">
    <div class="cat-header">
      <h2>Monsters</h2>
    </div>
    <div class="monster-grid" id="monster-grid"></div>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
    <div class="modal-top">
      <span class="icon-box"><img id="modal-img" src="" alt=""></span>
      <div class="modal-info">
        <h3 id="modal-name"></h3>
        <div class="m-level" id="modal-level"></div>
      </div>
      <button class="modal-close" id="btn-close" aria-label="Close">✕</button>
    </div>
    <div class="drops">
      <h4>Drops</h4>
      <div class="drop-list" id="modal-drops"></div>
    </div>
  </div>
</div>

<script>
  // --- Sample data: replace or extend this list once you have your own monsters ---
  const monsters = [
    {
      name: "Slime",
      level: 1,
      icon: "monstruoname.png",
      drops: [
        { name: "Sticky Gel", icon: "itemdefault.png" },
        { name: "Gelatinous Chunk", icon: "itemdefault.png" },
        { name: "Slime Core", icon: "itemdefault.png" }
      ]
    },
    {
      name: "Goblin",
      level: 3,
      icon: "monstruoname.png",
      drops: [
        { name: "Rusty Dagger", icon: "itemdefault.png" },
        { name: "Goblin Ear", icon: "itemdefault.png" },
        { name: "Copper Coin", icon: "itemdefault.png" }
      ]
    },
    {
      name: "Skeleton",
      level: 5,
      icon: "monstruoname.png",
      drops: [
        { name: "Bone", icon: "itemdefault.png" },
        { name: "Broken Sword", icon: "itemdefault.png" },
        { name: "Skull", icon: "itemdefault.png" }
      ]
    },
    {
      name: "Giant Spider",
      level: 7,
      icon: "monstruoname.png",
      drops: [
        { name: "Spider Silk", icon: "itemdefault.png" },
        { name: "Venom Fang", icon: "itemdefault.png" },
        { name: "Compound Eye", icon: "itemdefault.png" }
      ]
    },
    {
      name: "Young Dragon",
      level: 15,
      icon: "monstruoname.png",
      drops: [
        { name: "Dragon Scale", icon: "itemdefault.png" },
        { name: "Sharp Claw", icon: "itemdefault.png" },
        { name: "Bottled Breath", icon: "itemdefault.png" }
      ]
    }
  ];

  const grid = document.getElementById("monster-grid");
  const btnMonsters = document.getElementById("btn-monsters");
  const category = document.getElementById("monster-category");
  const overlay = document.getElementById("overlay");
  const btnClose = document.getElementById("btn-close");
  const hint = document.getElementById("hint");

  function renderGrid(){
    grid.innerHTML = "";
    monsters.forEach((m, i) => {
      const card = document.createElement("button");
      card.className = "monster-card";
      card.innerHTML = `
        <span class="icon-box"><img src="${m.icon}" alt=""></span>
        <span class="m-name">${m.name}</span>
        <span class="m-level">Level ${m.level}</span>
      `;
      card.addEventListener("click", () => openModal(i));
      grid.appendChild(card);
    });
  }

  function openModal(i){
    const m = monsters[i];
    document.getElementById("modal-img").src = m.icon;
    document.getElementById("modal-name").textContent = m.name;
    document.getElementById("modal-level").textContent = "Level " + m.level;

    const dropsBox = document.getElementById("modal-drops");
    dropsBox.innerHTML = "";
    m.drops.forEach(d => {
      const row = document.createElement("div");
      row.className = "drop-item";
      row.innerHTML = `
        <span class="icon-box"><img src="${d.icon}" alt=""></span>
        <span>${d.name}</span>
      `;
      dropsBox.appendChild(row);
    });

    overlay.classList.add("open");
  }

  function closeModal(){
    overlay.classList.remove("open");
  }

  btnMonsters.addEventListener("click", () => {
    const isOpen = category.classList.toggle("open");
    btnMonsters.setAttribute("aria-expanded", isOpen);
    // hide the "pick an option" hint once something is actually open
    hint.style.display = isOpen ? "none" : "flex";
  });

  btnClose.addEventListener("click", closeModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  renderGrid();

  /* =========================================================
     Hint carousel: cycles through the top-bar options one at a
     time, on a loop, so people know what's clickable up there.
     Add more entries here whenever a new button is added to the
     header — the carousel picks them up automatically.
     ========================================================= */
  const hintOptions = [
    { icon: "monsterbutton.png", label: "Monsters" }
    // { icon: "nextbutton.png", label: "Next option" },  <- add future buttons like this
  ];

  const carousel = document.getElementById("hint-carousel");
  const chips = hintOptions.map(opt => {
    const chip = document.createElement("div");
    chip.className = "hint-chip";
    chip.innerHTML = `
      <span class="icon-box"><img src="${opt.icon}" alt=""></span>
      <span>${opt.label}</span>
    `;
    carousel.appendChild(chip);
    return chip;
  });

  const SHOW_MS = 1800;
  const GAP_MS = 400;
  let hintIndex = -1;

  function cycleHint(){
    if(chips.length === 0) return;
    if(hintIndex >= 0) chips[hintIndex].classList.remove("visible");
    hintIndex = (hintIndex + 1) % chips.length;
    setTimeout(() => {
      chips[hintIndex].classList.add("visible");
      setTimeout(cycleHint, SHOW_MS);
    }, GAP_MS);
  }
  cycleHint();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>Rucoy Online Kingdom</title>
<style>
  :root{
    --bg:#262626;
    --panel:#2f2f2f;
    --panel-2:#383838;
    --line:#454545;
    --ink:#f0eee9;
    --muted:#a8a49c;
    --accent:#c9a24b;
    --danger:#c94b4b;
    --ok:#4bc97a;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  button{font:inherit;color:inherit;background:none;border:0}
  input{font:inherit;color:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
  body{
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:"Press Start 2P",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.7;
  }

  /* --- icon box: holds either a plain png or a cropped sprite-sheet cell --- */
  .icon-box{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .icon-box img{
    width:100%;
    height:100%;
    object-fit:contain;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
  }
  /* a single cell cropped out of monsterlist.png, positioned/sized by JS */
  .icon-box img.sprite-icon{
    position:absolute;
    width:auto;
    height:auto;
    max-width:none;
    object-fit:fill;
  }

  .topbar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    background:var(--bg);
    z-index:10;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:.9rem 1rem;
    border-bottom:1px solid var(--line);
  }
  header .title{font-size:.7rem;letter-spacing:.02em}

  /* row of top-level buttons — add more here later */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.6rem;
    padding:.6rem .9rem;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .toolbar-btn{
    display:flex;
    align-items:center;
    gap:.6rem;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    padding:.6rem .9rem .6rem .5rem;
    border-radius:10px;
    cursor:pointer;
    font-size:.6rem;
    flex:none;
  }
  .toolbar-btn:hover{border-color:var(--accent)}
  .toolbar-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .toolbar-btn.active{border-color:var(--accent)}
  .toolbar-btn .icon-box{width:34px;height:34px;flex:none;border-radius:6px}

  main{max-width:960px;margin:0 auto;padding:1.5rem 1.25rem 3rem}

  /* --- hint shown before anything is opened, cycling through the top options --- */
  #hint{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.5rem;
    text-align:center;
    padding:4rem 1rem 3.5rem;
  }
  #hint p{
    font-size:.7rem;
    color:var(--muted);
    line-height:1.8;
    max-width:26ch;
  }
  #hint-carousel{
    position:relative;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hint-chip{
    position:absolute;
    display:flex;
    align-items:center;
    gap:.6rem;
    background:var(--panel);
    border:1px solid var(--line);
    padding:.6rem .9rem .6rem .5rem;
    border-radius:10px;
    font-size:.6rem;
    opacity:0;
    transition:opacity .35s ease;
    pointer-events:none;
  }
  .hint-chip.visible{opacity:1}
  .hint-chip .icon-box{width:34px;height:34px;flex:none;border-radius:6px}

  .panel{display:none}
  .panel.open{display:block}

  .cat-header{margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  .cat-header h2{font-size:.75rem;font-weight:400;color:var(--muted)}

  .group-title{
    font-size:.6rem;
    color:var(--accent);
    margin:1.75rem 0 .9rem;
  }
  .group-title:first-of-type{margin-top:0}

  .entity-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:1rem;
  }
  .entity-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:.85rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.55rem;
    cursor:pointer;
    text-align:center;
  }
  .entity-card:hover, .entity-card:focus-visible{border-color:var(--accent);outline:none}
  .entity-card .icon-box{width:72px;height:72px}
  .entity-card .e-name{font-size:.6rem}
  .entity-card .e-level{font-size:.55rem;color:var(--muted)}

  /* --- modal --- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:1.25rem;
    z-index:100;
  }
  .overlay.open{display:flex}

  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    max-width:420px;
    width:100%;
    max-height:calc(100% - 2rem);
    overflow-y:auto;
    padding:1.25rem;
  }
  .modal-top{
    display:flex;
    gap:1rem;
    align-items:center;
  }
  .modal-top .icon-box{width:88px;height:88px;flex:none}
  .modal-info{min-width:0;flex:1}
  .modal-info h3{font-size:.75rem;line-height:1.5}
  .modal-info .m-level{color:var(--muted);font-size:.6rem;margin-top:.5rem}

  .modal-close{
    margin-left:auto;
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    width:32px;height:32px;
    border-radius:8px;
    cursor:pointer;
    font-size:1rem;
    line-height:1;
    flex:none;
  }
  .modal-close:hover{color:var(--ink);border-color:var(--accent)}

  .drops{display:none}
  .drops.has-items{display:block}
  .drops h4{
    margin-top:1.5rem;
    margin-bottom:.7rem;
    font-size:.62rem;
    color:var(--muted);
    font-weight:400;
  }
  .drop-list{display:flex;flex-direction:column;gap:.5rem}
  .drop-item{
    display:flex;
    align-items:center;
    gap:.7rem;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:.45rem .6rem;
  }
  .drop-item .icon-box{width:36px;height:36px;flex:none;border-radius:6px}
  .drop-item span{font-size:.6rem;line-height:1.5}

  @media (max-width:480px){
    .entity-grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
    .entity-card .icon-box{width:60px;height:60px}
  }

  /* --- tracker panel --- */
  .total-tracked{
    font-size:.55rem;
    color:var(--muted);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:.5rem .7rem;
    white-space:nowrap;
  }
  .total-tracked b{color:var(--accent);font-weight:400}

  .tracker-search{
    display:flex;
    gap:.6rem;
    margin-bottom:1.5rem;
  }
  .tracker-search input{
    flex:1;
    min-width:0;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:.8rem .9rem;
    font-size:.65rem;
  }
  .tracker-search input:focus{outline:none;border-color:var(--accent)}
  .tracker-search button{
    background:var(--accent);
    color:#20180a;
    border-radius:10px;
    padding:.8rem 1.1rem;
    font-size:.6rem;
    cursor:pointer;
    flex:none;
  }
  .tracker-search button:disabled{opacity:.5;cursor:default}

  .tracker-status{
    font-size:.6rem;
    color:var(--muted);
    margin-bottom:1rem;
    display:none;
  }
  .tracker-status.show{display:block}
  .tracker-status.error{color:var(--danger)}

  .tracker-card{
    display:none;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:1.25rem;
    margin-bottom:2rem;
  }
  .tracker-card.show{display:block}

  .tracker-card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:1rem;
    flex-wrap:wrap;
    margin-bottom:1.25rem;
  }
  .tracker-card h3{font-size:.8rem;line-height:1.6}
  .tracker-badges{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
  .badge{
    font-size:.52rem;
    padding:.35rem .55rem;
    border-radius:6px;
    border:1px solid var(--line);
  }
  .badge.supporter{color:var(--accent);border-color:var(--accent)}
  .badge.gm{color:#7fb5e0;border-color:#7fb5e0}
  .badge.banned{color:var(--danger);border-color:var(--danger)}

  .tracker-fields{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:1rem;
  }
  .tracker-field{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:.7rem .8rem;
  }
  .tracker-field .f-label{font-size:.5rem;color:var(--muted);margin-bottom:.5rem}
  .tracker-field .f-value{font-size:.62rem;line-height:1.6}

  .tracker-alts{margin-top:1.25rem}
  .tracker-alts h4{font-size:.58rem;color:var(--muted);margin-bottom:.7rem;font-weight:400}
  .alt-list{display:flex;flex-wrap:wrap;gap:.5rem}
  .alt-chip{
    font-size:.58rem;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:.45rem .7rem;
    cursor:pointer;
  }
  .alt-chip:hover{border-color:var(--accent)}
</style>
</head>
<body>

<div class="topbar">
  <header>
    <span class="title">Rucoy Online Kingdom</span>
  </header>

  <!-- top-level sections — add more buttons here later -->
  <div class="toolbar">
    <button class="toolbar-btn" data-panel="monsters-panel" aria-expanded="false">
      <span class="icon-box"><img src="monsterbutton.png" alt=""></span>
      Monsters
    </button>
    <button class="toolbar-btn" data-panel="bosses-panel" aria-expanded="false">
      <span class="icon-box"><img src="bossicon.png" alt=""></span>
      Bosses
    </button>
    <button class="toolbar-btn" data-panel="tracker-panel" aria-expanded="false">
      <span class="icon-box"><img src="tracker.png" alt=""></span>
      Tracker
    </button>
  </div>
</div>

<main>
  <div id="hint">
    <p>Select one of the options above</p>
    <div id="hint-carousel"></div>
  </div>

  <section id="monsters-panel" class="panel" aria-label="Monsters">
    <div class="cat-header"><h2>Monsters</h2></div>
    <div class="entity-grid" id="monsters-grid"></div>
  </section>

  <section id="bosses-panel" class="panel" aria-label="Bosses">
    <div class="cat-header"><h2>Bosses</h2></div>
    <div id="bosses-groups"></div>
  </section>

  <section id="tracker-panel" class="panel" aria-label="Tracker">
    <div class="cat-header">
      <h2>Tracker</h2>
      <span class="total-tracked">Total Tracked <b id="tracker-total">0</b> characters</span>
    </div>

    <div class="tracker-search">
      <input type="text" id="tracker-input" placeholder="Character name..." autocomplete="off">
      <button id="tracker-search-btn">Search</button>
    </div>

    <div class="tracker-status" id="tracker-status"></div>

    <div class="tracker-card" id="tracker-card">
      <div class="tracker-card-top">
        <div>
          <h3 id="tk-name"></h3>
          <div class="tracker-badges" id="tk-badges"></div>
        </div>
      </div>
      <div class="tracker-fields" id="tk-fields"></div>
      <div class="tracker-alts" id="tk-alts-wrap" style="display:none">
        <h4>Another Accounts</h4>
        <div class="alt-list" id="tk-alts"></div>
      </div>
    </div>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
    <div class="modal-top">
      <span class="icon-box" id="modal-icon"></span>
      <div class="modal-info">
        <h3 id="modal-name"></h3>
        <div class="m-level" id="modal-level"></div>
      </div>
      <button class="modal-close" id="btn-close" aria-label="Close">✕</button>
    </div>
    <div class="drops" id="modal-drops-wrap">
      <h4>Drops</h4>
      <div class="drop-list" id="modal-drops"></div>
    </div>
  </div>
</div>

<script>
  /* =========================================================
     Sprite sheet (monsterlist.png)
     Every monster/boss icon is one cell cropped out of this
     single image, instead of a separate png per creature.

     DEFAULT_CELL: the grid size used unless an entry says
     otherwise (your mob list uses a 32x32 grid). A few boss
     entries were built on a different grid (48x48) — those set
     their own `cell` and override the default just for them.

     Coordinates are { row, col }, both 0-indexed: row 0 / col 0
     is the top-left cell of the sheet.
     ========================================================= */
  const SPRITE_SHEET = "monsterlist.png";
  const DEFAULT_CELL = 32;

  // --- Monsters (32x32 grid) ---
  const monsters = [
    { name: "Crab",                 level: 1,   icon: { col: 0,  row: 0 } },
    { name: "Rat",                  level: 1,   icon: { col: 1,  row: 0 } },
    { name: "Rat",                  level: 3,   icon: { col: 2,  row: 0 } },
    { name: "Crow",                 level: 6,   icon: { col: 3,  row: 0 } },
    { name: "Wolf",                 level: 9,   icon: { col: 4,  row: 0 } },
    { name: "Scorpion",             level: 12,  icon: { col: 5,  row: 0 } },
    { name: "Cobra",                level: 13,  icon: { col: 6,  row: 0 } },
    { name: "Worm",                 level: 14,  icon: { col: 7,  row: 0 } },
    { name: "Goblin",               level: 15,  icon: { col: 8,  row: 0 } },
    { name: "Mummy",                level: 25,  icon: { col: 9,  row: 0 } },
    { name: "Pharaon",              level: 35,  icon: { col: 10, row: 0 } },
    { name: "Assassin",             level: 40,  icon: { col: 0,  row: 2 } },
    { name: "Assassin",             level: 45,  icon: { col: 0,  row: 1 } },
    { name: "Assassin Ninja",       level: 50,  icon: { col: 0,  row: 3 } },
    { name: "Zombie",               level: 65,  icon: { col: 1,  row: 1 } },
    { name: "Headless Zombie",      level: 65,  icon: { col: 1,  row: 2 } },
    { name: "Skeleton",             level: 75,  icon: { col: 2,  row: 1 } },
    { name: "Skeleton Archer",      level: 80,  icon: { col: 2,  row: 2 } },
    { name: "Skeleton Warrior",     level: 90,  icon: { col: 2,  row: 3 } },
    { name: "Vampire",              level: 100, icon: { col: 3,  row: 1 } },
    { name: "Vampire",              level: 110, icon: { col: 3,  row: 2 } },
    { name: "Drow Assassin",        level: 120, icon: { col: 4,  row: 1 } },
    { name: "Drow Ranger",          level: 125, icon: { col: 4,  row: 2 } },
    { name: "Drow Mage",            level: 130, icon: { col: 5,  row: 2 } },
    { name: "Drow Fighter",         level: 135, icon: { col: 5,  row: 1 } },
    { name: "Drow Sorceress",       level: 140, icon: { col: 5,  row: 3 } },
    { name: "Lizard Warrior",       level: 150, icon: { col: 6,  row: 2 } },
    { name: "Lizard Archer",        level: 160, icon: { col: 6,  row: 1 } },
    { name: "Lizard Shaman",        level: 170, icon: { col: 7,  row: 1 } },
    { name: "Lizard Captain",       level: 180, icon: { col: 8,  row: 2 } },
    { name: "Lizard High Shaman",   level: 190, icon: { col: 8,  row: 3 } },
    { name: "Djinn",                level: 150, icon: { col: 9,  row: 2 } },
    { name: "Dead Eye",             level: 170, icon: { col: 9,  row: 1 } },
    { name: "Gargoyle",             level: 190, icon: { col: 10, row: 2 } },
    { name: "Minotaur",             level: 225, icon: { col: 11, row: 0 } },
    { name: "Minotaur",             level: 250, icon: { col: 11, row: 1 } },
    { name: "Minotaur",             level: 275, icon: { col: 11, row: 2 } },
    { name: "Dragon Hatchling",     level: 240, icon: { col: 12, row: 0 } },
    { name: "Dragon",               level: 250, icon: { col: 12, row: 1 } },
    { name: "Dragon Warden",        level: 280, icon: { col: 12, row: 2 } },
    { name: "Ice Elemental",        level: 300, icon: { col: 13, row: 1 } },
    { name: "Ice Dragon",           level: 325, icon: { col: 13, row: 0 } },
    { name: "Yeti",                 level: 350, icon: { col: 13, row: 2 } },
    { name: "Lava Golem",           level: 375, icon: { col: 14, row: 1 } },
    { name: "Orthrus",              level: 400, icon: { col: 14, row: 2 } },
    { name: "Demon",                level: 450, icon: { col: 14, row: 0 } }
  ];

  // --- Bosses, grouped. Same 32x32 grid unless an entry sets its own `cell`. ---
  const bossGroups = [
    {
      title: "Normal Bosses",
      bosses: [
        { name: "Vampire King",     icon: { col: 3,  row: 3 } },
        { name: "Drow Queen",       icon: { col: 5,  row: 4 } },
        { name: "General Krinok",   icon: { col: 8,  row: 4 } },
        { name: "Gargoyle",         icon: { col: 10, row: 3 } },
        { name: "Zarron Bravehorn", icon: { col: 11, row: 3 } },
        { name: "Cerberus",         icon: { col: 14, row: 3 } }
      ]
    },
    {
      title: "Uncommon Bosses",
      bosses: [
        { name: "Slime Lord",       icon: { col: 16, row: 0 } },
        { name: "Goblin Lord",      icon: { col: 8,  row: 1 } },
        { name: "Kamon The Cursed", icon: { col: 10, row: 1 } }
      ]
    },
    {
      title: "Christmas Bosses",
      bosses: [
        { name: "Evil Santa",    icon: { col: 16, row: 1 } },
        { name: "Evil Snowman",  icon: { col: 16, row: 2 } }
      ]
    },
    {
      title: "Halloween Bosses",
      bosses: [
        { name: "Wicked Pumpkin", icon: { col: 17, row: 1 } },
        { name: "La Calaca",      icon: { col: 17, row: 0 } },
        { name: "Haunted Willow", icon: { col: 11, row: 2, cell: 48 } }
      ]
    },
    {
      title: "Easter Bosses",
      bosses: [
        { name: "Bonnie Rabbit",      icon: { col: 18, row: 0 } },
        { name: "Clyde Rabbit",       icon: { col: 18, row: 1 } },
        { name: "Blue Easter Egg",    icon: { col: 19, row: 0 } },
        { name: "Green Easter Egg",   icon: { col: 19, row: 1 } },
        { name: "Purple Easter Egg",  icon: { col: 19, row: 2 } }
      ]
    },
    {
      title: "Legendary Bosses",
      bosses: [
        { name: "Drakon The Devourer", icon: { col: 0, row: 4, cell: 48 } },
        { name: "Rat King",            icon: { col: 1, row: 4, cell: 48 } },
        { name: "Korvak Deathfrost",   icon: { col: 2, row: 4, cell: 48 } }
      ]
    }
  ];

  // Loaded once, lazily, the first time a sprite icon is needed.
  let sheetSize = null; // {w, h} natural pixel size of monsterlist.png
  let sheetLoading = null;
  function loadSheet(){
    if(sheetLoading) return sheetLoading;
    sheetLoading = new Promise(resolve => {
      const img = new Image();
      img.onload = () => { sheetSize = { w: img.naturalWidth, h: img.naturalHeight }; resolve(sheetSize); };
      img.onerror = () => resolve(null);
      img.src = SPRITE_SHEET;
    });
    return sheetLoading;
  }

  // Builds an .icon-box containing the cropped {row, col} cell from the
  // sheet, scaled to whatever size the box ends up being rendered at.
  function spriteBox(icon, extraClass){
    const cell = icon.cell || DEFAULT_CELL;
    const box = document.createElement("span");
    box.className = "icon-box" + (extraClass ? " " + extraClass : "");
    const img = document.createElement("img");
    img.className = "sprite-icon";
    img.alt = "";
    img.dataset.row = icon.row;
    img.dataset.col = icon.col;
    img.dataset.cell = cell;
    img.src = SPRITE_SHEET;
    box.appendChild(img);
    placeSprite(img);
    loadSheet().then(() => placeSprite(img));
    return box;
  }

  // Positions/sizes one sprite <img> inside its box. Safe to call
  // repeatedly (on load, on panel-open, on resize) — it's a no-op
  // if the box has no real size yet (e.g. still display:none).
  function placeSprite(img){
    const box = img.parentElement;
    if(!box) return;
    const size = box.clientWidth || box.clientHeight;
    if(!size) return;
    const cell = Number(img.dataset.cell) || DEFAULT_CELL;
    const scale = size / cell;
    const row = Number(img.dataset.row), col = Number(img.dataset.col);
    img.style.left = (-col * cell * scale) + "px";
    img.style.top = (-row * cell * scale) + "px";
    if(sheetSize){
      img.style.width = (sheetSize.w * scale) + "px";
      img.style.height = (sheetSize.h * scale) + "px";
    } else {
      img.style.width = size + "px";
      img.style.height = size + "px";
    }
  }

  // Re-places every sprite inside `root` — call right after a hidden
  // panel (closed section, closed modal) becomes visible.
  function placeSpritesIn(root){
    root.querySelectorAll(".sprite-icon").forEach(placeSprite);
  }

  let spriteResizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(spriteResizeTimer);
    spriteResizeTimer = setTimeout(() => placeSpritesIn(document.body), 150);
  });

  /* =========================================================
     Rendering
     ========================================================= */
  function makeCard(entity){
    const card = document.createElement("button");
    card.className = "entity-card";
    card.appendChild(spriteBox(entity.icon));

    const nameEl = document.createElement("span");
    nameEl.className = "e-name";
    nameEl.textContent = entity.name;
    card.appendChild(nameEl);

    if(entity.level !== undefined){
      const levelEl = document.createElement("span");
      levelEl.className = "e-level";
      levelEl.textContent = "Level " + entity.level;
      card.appendChild(levelEl);
    }

    card.addEventListener("click", () => openModal(entity));
    return card;
  }

  function renderMonsters(){
    const gridEl = document.getElementById("monsters-grid");
    gridEl.innerHTML = "";
    monsters.forEach(m => gridEl.appendChild(makeCard(m)));
  }

  function renderBosses(){
    const wrap = document.getElementById("bosses-groups");
    wrap.innerHTML = "";
    bossGroups.forEach(group => {
      const h3 = document.createElement("h3");
      h3.className = "group-title";
      h3.textContent = group.title;
      wrap.appendChild(h3);

      const gridEl = document.createElement("div");
      gridEl.className = "entity-grid";
      group.bosses.forEach(b => gridEl.appendChild(makeCard(b)));
      wrap.appendChild(gridEl);
    });
  }

  function openModal(entity){
    const iconSlot = document.getElementById("modal-icon");
    iconSlot.innerHTML = "";
    iconSlot.appendChild(spriteBox(entity.icon).firstChild);

    document.getElementById("modal-name").textContent = entity.name;

    const levelEl = document.getElementById("modal-level");
    if(entity.level !== undefined){
      levelEl.textContent = "Level " + entity.level;
      levelEl.style.display = "";
    } else {
      levelEl.style.display = "none";
    }

    const dropsWrap = document.getElementById("modal-drops-wrap");
    const dropsBox = document.getElementById("modal-drops");
    dropsBox.innerHTML = "";
    const drops = entity.drops || [];
    if(drops.length){
      dropsWrap.classList.add("has-items");
      drops.forEach(d => {
        const row = document.createElement("div");
        row.className = "drop-item";
        row.innerHTML = `
          <span class="icon-box"><img src="${d.icon}" alt=""></span>
          <span>${d.name}</span>
        `;
        dropsBox.appendChild(row);
      });
    } else {
      dropsWrap.classList.remove("has-items");
    }

    // the modal was still display:none while the icon above was measured,
    // so its box had no real width yet — redraw now that it's shown
    overlay.classList.add("open");
    placeSpritesIn(overlay);
  }

  function closeModal(){
    overlay.classList.remove("open");
  }

  /* =========================================================
     Top-level panels (Monsters / Bosses) + "pick an option" hint
     ========================================================= */
  const overlay = document.getElementById("overlay");
  const btnClose = document.getElementById("btn-close");
  const hint = document.getElementById("hint");
  const toolbarBtns = Array.from(document.querySelectorAll(".toolbar-btn"));

  function anyPanelOpen(){
    return document.querySelector(".panel.open") !== null;
  }

  toolbarBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      const panel = document.getElementById(btn.dataset.panel);
      const opening = !panel.classList.contains("open");

      // only one panel open at a time
      document.querySelectorAll(".panel.open").forEach(p => p.classList.remove("open"));
      toolbarBtns.forEach(b => { b.classList.remove("active"); b.setAttribute("aria-expanded", "false"); });

      if(opening){
        panel.classList.add("open");
        btn.classList.add("active");
        btn.setAttribute("aria-expanded", "true");
        placeSpritesIn(panel);
        if(typeof onPanelOpen === "function") onPanelOpen(panel.id);
      }

      hint.style.display = anyPanelOpen() ? "none" : "flex";
    });
  });

  btnClose.addEventListener("click", closeModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  renderMonsters();
  renderBosses();

  /* =========================================================
     Hint carousel: cycles through the top-bar options one at a
     time, on a loop, so people know what's clickable up there.
     Mirrors the toolbar buttons — add a new button above and a
     matching line here.
     ========================================================= */
  const hintOptions = [
    { icon: "monsterbutton.png", label: "Monsters" },
    { icon: "bossicon.png",      label: "Bosses" },
    { icon: "tracker.png",       label: "Tracker" }
  ];

  const carousel = document.getElementById("hint-carousel");
  const chips = hintOptions.map(opt => {
    const chip = document.createElement("div");
    chip.className = "hint-chip";
    chip.innerHTML = `
      <span class="icon-box"><img src="${opt.icon}" alt=""></span>
      <span>${opt.label}</span>
    `;
    carousel.appendChild(chip);
    return chip;
  });

  const SHOW_MS = 1800;
  const GAP_MS = 400;
  let hintIndex = -1;

  function cycleHint(){
    if(chips.length === 0) return;
    if(hintIndex >= 0) chips[hintIndex].classList.remove("visible");
    hintIndex = (hintIndex + 1) % chips.length;
    setTimeout(() => {
      chips[hintIndex].classList.add("visible");
      setTimeout(cycleHint, SHOW_MS);
    }, GAP_MS);
  }
  cycleHint();

  /* =========================================================
     Tracker
     ---------------------------------------------------------
     rucoyonline.com does not allow cross-origin requests from
     the browser, and a static json file can't be written to
     from client-side JS — so a small backend does the actual
     fetching + persistence. Point this at your deployed worker
     (see worker.js). Everything below just talks to that API.
     ========================================================= */
  const TRACKER_API = "https://long-bush-0943.cuboinfernal65.workers.dev/"; // <-- set this after deploying worker.js

  const tkInput      = document.getElementById("tracker-input");
  const tkSearchBtn  = document.getElementById("tracker-search-btn");
  const tkStatus     = document.getElementById("tracker-status");
  const tkCard       = document.getElementById("tracker-card");
  const tkName       = document.getElementById("tk-name");
  const tkBadges     = document.getElementById("tk-badges");
  const tkFields     = document.getElementById("tk-fields");
  const tkAltsWrap   = document.getElementById("tk-alts-wrap");
  const tkAlts       = document.getElementById("tk-alts");
  const tkTotal      = document.getElementById("tracker-total");

  function setStatus(msg, isError){
    tkStatus.textContent = msg || "";
    tkStatus.classList.toggle("show", !!msg);
    tkStatus.classList.toggle("error", !!isError);
  }

  function field(label, value){
    const box = document.createElement("div");
    box.className = "tracker-field";
    box.innerHTML = `<div class="f-label">${label}</div><div class="f-value"></div>`;
    box.querySelector(".f-value").textContent = value;
    return box;
  }

  function renderCharacter(data){
    tkName.textContent = data.name;

    tkBadges.innerHTML = "";
    if(data.supporter){
      const b = document.createElement("span");
      b.className = "badge supporter";
      b.textContent = "Supporter";
      tkBadges.appendChild(b);
    }
    if(data.gameMaster){
      const b = document.createElement("span");
      b.className = "badge gm";
      b.textContent = "Game Master";
      tkBadges.appendChild(b);
    }
    if(data.banned){
      const b = document.createElement("span");
      b.className = "badge banned";
      b.textContent = "Banned";
      tkBadges.appendChild(b);
    }

    tkFields.innerHTML = "";
    if(data.level)      tkFields.appendChild(field("Level", data.level));
    if(data.title)      tkFields.appendChild(field("Title", data.title));
    if(data.guild)       tkFields.appendChild(field("Guild", data.guild));
    if(data.born)        tkFields.appendChild(field("Born", data.born));
    if(data.lastOnline)  tkFields.appendChild(field("Last online", data.lastOnline));

    const alts = data.anotherAccounts || [];
    tkAlts.innerHTML = "";
    if(alts.length){
      tkAltsWrap.style.display = "";
      alts.forEach(altName => {
        const chip = document.createElement("span");
        chip.className = "alt-chip";
        chip.textContent = altName;
        chip.addEventListener("click", () => { tkInput.value = altName; searchTracker(); });
        tkAlts.appendChild(chip);
      });
    } else {
      tkAltsWrap.style.display = "none";
    }

    tkCard.classList.add("show");
  }

  async function fetchTotal(){
    if(!TRACKER_API || TRACKER_API.includes("YOUR-WORKER")) return;
    try{
      const res = await fetch(`${TRACKER_API}/total`);
      if(!res.ok) return;
      const data = await res.json();
      tkTotal.textContent = data.total ?? 0;
    }catch(e){ /* silent — total is a nice-to-have */ }
  }

  async function searchTracker(){
    const name = tkInput.value.trim();
    if(!name) return;

    if(!TRACKER_API || TRACKER_API.includes("YOUR-WORKER")){
      setStatus("Tracker backend not configured yet (set TRACKER_API in the script).", true);
      return;
    }

    tkSearchBtn.disabled = true;
    tkCard.classList.remove("show");
    setStatus("Searching...");

    try{
      const res = await fetch(`${TRACKER_API}/track?name=${encodeURIComponent(name)}`);
      const data = await res.json();

      if(!res.ok || data.error){
        setStatus(data.error || "Character not found.", true);
        return;
      }

      setStatus("");
      renderCharacter(data);
      fetchTotal();
    }catch(e){
      setStatus("Could not reach the tracker backend.", true);
    }finally{
      tkSearchBtn.disabled = false;
    }
  }

  tkSearchBtn.addEventListener("click", searchTracker);
  tkInput.addEventListener("keydown", (e) => { if(e.key === "Enter") searchTracker(); });

  // called from the toolbar click handler when a panel is opened
  function onPanelOpen(panelId){
    if(panelId === "tracker-panel") fetchTotal();
  }
</script>

</body>
</html>
